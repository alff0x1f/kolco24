{% if open_photo_contests %}
<section class="card home-photo-contests" aria-labelledby="home-photo-title">
  <div class="side-head">
    <h3 id="home-photo-title">Фотоконкурс</h3>
  </div>
  <div class="card-pad">
    {% for contest in open_photo_contests %}
    <p class="home-photo-contests__item">
      <a href="{% url 'photo_contest' contest.slug %}">{{ contest.title }}</a>
      <span>приём фото до {{ contest.submission_until|date:"j E" }}</span>
    </p>
    {% endfor %}
  </div>
</section>
{% endif %}
