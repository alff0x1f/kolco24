upstream django {
    server kolco24_django:8000;
}

# Pull-through cache for map tiles (race map page). Tiles are cached for a
# week and kept on disk for 90 days so the map keeps working when the server
# runs offline at a race site: browse the race area at home to warm the cache,
# in the field cached tiles are served even when expired (proxy_cache_use_stale
# below), unwarmed tiles fail fast into the JS error-tile placeholder.
proxy_cache_path /var/cache/nginx/tiles levels=1:2 keys_zone=tiles:10m
                 max_size=5g inactive=90d use_temp_path=off;

server {
    listen 80;
    client_max_body_size 50m;

    # Resolve the real client IP when requests arrive through the external reverse
    # proxy in the Docker "proxy" network (docker-compose_v2.yml).  Without this,
    # $remote_addr is the upstream proxy's internal Docker IP, so X-Real-IP would
    # be that same proxy IP and all clients would collapse into one throttle bucket.
    # The real_ip module replaces $remote_addr with the actual client IP extracted
    # from X-Forwarded-For, trusting only headers forwarded by the upstream proxy.
    #
    # TRUSTED_PROXY_CIDR must be set to the proxy container's IP or its network
    # CIDR — never broader than necessary.  Find the actual value with:
    #   docker network inspect proxy | grep Subnet
    # or use the proxy container's specific IP (e.g. 172.18.0.2/32) for the
    # tightest isolation.  Trusting a broad range lets any container in that range
    # forge X-Forwarded-For and spoof the throttle key.
    set_real_ip_from ${TRUSTED_PROXY_CIDR};
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Tile proxy locations. proxy_pass goes through a variable so the upstream
    # hostname is resolved at request time via Docker's embedded DNS — with a
    # hostname written directly into proxy_pass nginx resolves it at startup
    # and would fail to start at an offline race site. The path regex admits
    # only z/x/y.png, so this is not an open proxy. proxy_ignore_headers is
    # required for the week-long TTL: tile servers send their own (shorter)
    # Cache-Control, which would otherwise override proxy_cache_valid.
    # nginx's envsubst templating only touches ${VAR} tokens, so the $vars
    # here survive rendering untouched.
    location ~ ^/tiles/osm/(\d+/\d+/\d+\.png)$ {
        set $tile_upstream tile.openstreetmap.org;
        resolver 127.0.0.11 valid=300s ipv6=off;
        proxy_pass https://$tile_upstream/$1;
        proxy_ssl_server_name on;
        proxy_set_header Host $tile_upstream;
        proxy_set_header User-Agent "kolco24.ru tile cache";
        proxy_cache tiles;
        proxy_cache_key $uri;
        proxy_cache_valid 200 7d;
        proxy_cache_revalidate on;
        proxy_ignore_headers Cache-Control Expires;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        expires 7d;
        add_header X-Cache-Status $upstream_cache_status;
    }

    location ~ ^/tiles/topo/(\d+/\d+/\d+\.png)$ {
        set $tile_upstream tile.opentopomap.org;
        resolver 127.0.0.11 valid=300s ipv6=off;
        proxy_pass https://$tile_upstream/$1;
        proxy_ssl_server_name on;
        proxy_set_header Host $tile_upstream;
        proxy_set_header User-Agent "kolco24.ru tile cache";
        proxy_cache tiles;
        proxy_cache_key $uri;
        proxy_cache_valid 200 7d;
        proxy_cache_revalidate on;
        proxy_ignore_headers Cache-Control Expires;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        expires 7d;
        add_header X-Cache-Status $upstream_cache_status;
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        # After real_ip resolution, $remote_addr is the actual client IP.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
